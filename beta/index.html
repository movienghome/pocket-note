<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>포켓 노트</title>
<meta name="theme-color" content="#2c6e5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓 노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate form,.gate .box{width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.gate h1{font:700 26px/1.3 var(--f-title);margin:0 0 4px;display:flex;gap:10px;align-items:center}
.gate h1 img{width:40px;height:40px;border-radius:10px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{padding:11px 12px;font-size:16px}
.gate .primary{justify-content:center;padding:11px;font-size:15px}
.gate .links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gate .links button{color:var(--accent);font-size:13.5px;padding:4px 0}
.gate .err{color:var(--danger);font-size:13.5px;min-height:1.2em}
.gate code{font-family:var(--f-mono);background:var(--panel);padding:1px 5px;border-radius:4px;font-size:13px}
/* 3-pane notebook: folders | note list | page. Phone: one pane at a time, swipe between notes, toolbar rides the keyboard. */
:root{
  --bg:#f6f7f5; --panel:#eef0ec; --paper:#ffffff; --ink:#1d2421; --muted:#68716c; --line:#dde1dc;
  --accent:#2c6e5f; --mark:#fbeaa0; --danger:#b4432f;
  --accent-soft:color-mix(in srgb,var(--accent) 15%,var(--paper));
  --hover:color-mix(in srgb,var(--ink) 6%,var(--panel));
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:var(--f-ui);
  --f-title:"Gowun Batang","Nanum Myeongjo",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fs:16px; --lh:1.75; --pw:760px; --kb:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a18; --panel:#1b201e; --paper:#1f2522; --ink:#e3e8e5; --muted:#919b96; --line:#2e3532;
  --accent:#6fbfa9; --mark:#5d5320; --danger:#e07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a18; --panel:#1b201e; --paper:#1f2522; --ink:#e3e8e5; --muted:#919b96; --line:#2e3532;
  --accent:#6fbfa9; --mark:#5d5320; --danger:#e07a63; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:250px 320px 1fr;height:100%}
.app.noside{grid-template-columns:0 320px 1fr}
@media (min-width:821px){.app.nonote{grid-template-columns:250px minmax(0,1fr) 0}.app.nonote.noside{grid-template-columns:0 minmax(0,1fr) 0}.app.nonote .note{display:none}.app.nonote .list{border-right:0}}
.brand .home{display:flex;gap:8px;align-items:center;font-weight:600;padding:2px 4px;margin-left:-4px}
.brand .home:hover{background:var(--hover)}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-scroll{overflow-y:auto;flex:1;padding:4px 8px 24px}
.brand{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-weight:600}
.brand .home b{font-family:var(--f-title);font-size:17px}
.brand .st{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.secbox{margin-top:6px}
.sec{display:flex;align-items:center;gap:2px;padding:6px 4px 2px}
.sec-h{flex:1;text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding:3px 4px;display:flex;align-items:center;gap:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sec-h .car{display:inline-block;width:10px;transition:transform .15s}
.secbox.col .sec-h .car{transform:rotate(-90deg)}
.secbox.col .sec-body{display:none}
.sec button.sa{padding:2px 5px;color:var(--muted)}
.sec button.sa:hover{color:var(--ink);background:var(--hover)}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;text-align:left;font-size:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav .tw{width:14px;display:inline-flex;justify-content:center;color:var(--muted);flex:none;font-size:11px}
.nav .more{opacity:0;padding:0 2px;display:inline-flex}
.nav:hover .more,.nav.on .more{opacity:.7}
@media (hover:none){.nav .more{opacity:.55}}
.emo{width:18px;text-align:center;flex:none;font-size:15px;line-height:1}
.ftree .ftree{padding-left:14px}
.ftree:empty{min-height:3px}
.hint{color:var(--muted);font-size:12.5px;padding:4px 8px}
.side-foot{border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;flex-wrap:wrap}
.side-foot button{font-size:12.5px;padding:6px 8px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.side-foot button:hover{background:var(--hover);color:var(--ink)}
.drag-ghost{opacity:.35;background:var(--accent-soft)!important}
/* list */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.list-head{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.lh-row{display:flex;align-items:center;gap:4px}
.lh-row h2{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.search{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.search input{border:0;background:none;flex:1;min-width:0;padding:7px 0}
.search input:focus{outline:none}
.iconbtn{padding:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);min-width:32px;min-height:32px}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn.on{color:var(--accent)}
.iconbtn[disabled]{opacity:.3;pointer-events:none}
.primary{background:var(--accent);color:var(--paper);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:500;font-size:14px}
.primary svg{stroke:var(--paper)}
.ghost{border:1px solid var(--line);padding:7px 12px}
.items{overflow-y:auto;flex:1}
.item{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);border-radius:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:hover{background:var(--hover)}
.item.on{background:var(--accent-soft)}
.item .t{font-weight:500;display:flex;gap:6px;align-items:center}
.item .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .t svg{width:13px;height:13px;color:var(--accent)}
.item .s{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}
.item .m{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chip{background:var(--panel);border-radius:4px;padding:0 5px}
.empty{padding:40px 24px;color:var(--muted);text-align:center;line-height:1.7;font-size:14px}
.banner{margin:10px 12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.banner button{align-self:flex-start}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:6px}
.gallery button{padding:0;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--panel);max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
/* note */
.note{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);position:relative}
.note-bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.note-bar .pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px;min-width:34px;text-align:center}
.note-bar select{max-width:150px;padding:4px 6px;font-size:13px;margin-left:4px}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:0 4px;flex:none}
.seg button{border-radius:0;padding:4px 9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.note-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.page{max-width:var(--pw);margin:0 auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 160px max(20px,env(safe-area-inset-left,0px))}
.page.slide-l{animation:sl .22s ease-out}.page.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.3}}@keyframes sr{from{transform:translateX(-40px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.page.slide-l,.page.slide-r{animation:none}}
.ttl{width:100%;border:0;background:none;font:700 1.45em/1.35 var(--f-title);padding:0 0 8px;color:var(--ink);border-radius:0}
.ttl::placeholder{color:var(--muted);opacity:.55}
.ttl:focus{outline:none}
.rtitle{font:700 1.6em/1.35 var(--f-title);margin:0 0 .6em}
textarea#ed{width:100%;border:0;background:none;color:var(--ink);font:var(--fs)/var(--lh) var(--f-mono);resize:none;outline:none;min-height:60vh;padding:0;tab-size:4}
.trash-note{background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trash-note button{color:var(--accent);font-weight:500}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:1px;padding:3px max(6px,env(safe-area-inset-right,0px)) 3px max(6px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--paper);z-index:15}
.tb-scroll{display:flex;gap:1px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
.tb-scroll::-webkit-scrollbar{display:none}
.toolbar button,.toolbar label{cursor:pointer;border-radius:6px;padding:8px 9px;color:var(--muted);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:38px;flex:none}
.toolbar button:hover,.toolbar label:hover{background:var(--hover);color:var(--ink)}
.toolbar .tb-fixed{border-left:1px solid var(--line);padding-left:4px;display:flex}
.toolbar.top{border-top:0;border-bottom:1px solid var(--line)}
/* live editor */
#live{outline:none;font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh);min-height:55vh;caret-color:var(--accent);word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
#live[data-empty="1"] .ln:first-child::before{content:"메모를 적어 보세요";color:var(--muted);opacity:.6;position:absolute;pointer-events:none}
.ln{min-height:calc(var(--fs) * var(--lh));position:relative}
.gut{position:absolute;left:-20px;top:0;width:18px;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
.lfold{color:var(--muted);font-size:.72em;cursor:pointer;padding:0 3px;opacity:.75}
.lfold:hover{color:var(--accent);opacity:1}
.ln .bul,.ln .oln{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ln .cbx{touch-action:none}
.ln.dragging{opacity:.35}
.ln.drop-b{box-shadow:0 -2px 0 var(--accent)}
.ln.drop-a{box-shadow:0 2px 0 var(--accent)}
body.lvdrag,body.lvdrag *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing}
.md li{position:relative}
.rfold{position:absolute;left:-1.35em;top:.3em;color:var(--muted);cursor:pointer;font-size:.72em;width:1.2em;text-align:center;user-select:none}
.md li.task>.rfold{left:-.2em}
.md li.folded>ul,.md li.folded>ol{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ln.hid{display:none}
.ln.h1{font:700 1.55em/1.35 var(--f-title);margin:.5em 0 .15em}
.ln.h2{font:700 1.32em/1.4 var(--f-title);margin:.45em 0 .1em}
.ln.h3{font:700 1.15em/1.45 var(--f-title);margin:.35em 0 .05em}
.ln.h4,.ln.h5,.ln.h6{font-weight:600}
.ln.raw.h1,.ln.raw.h2,.ln.raw.h3{font-family:var(--f-body)}
.ln .sx{color:var(--muted);opacity:.7}
.ln .cbx{display:inline-flex;width:1.05em;height:1.05em;border:1.6px solid var(--muted);border-radius:4px;vertical-align:-.17em;margin-right:.5em;cursor:pointer;align-items:center;justify-content:center;font-size:.8em;color:transparent;line-height:1}
.ln .cbx.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.ln.done .tx{text-decoration:line-through;color:var(--muted)}
.ln .bul{display:inline-block;width:1.1em;color:var(--accent);font-weight:700}
.ln .oln{display:inline-block;min-width:1.4em;color:var(--accent);font-variant-numeric:tabular-nums}
.ln.q{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.ln.co{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:12px;color:var(--ink)}
.ln.co-h{font-weight:600;color:var(--accent);padding-top:4px}
.ln.co-last{padding-bottom:4px}
.ln.fc{font-family:var(--f-mono);font-size:.86em;background:var(--panel);padding-left:12px}
.ln.fc-edge{color:var(--muted)}
.ln.chipline{font-size:.86em;background:none}
.fold{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 8px;color:var(--muted);cursor:pointer;font-family:var(--f-ui);font-weight:500}
.co .fold{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:1em}
.ln.fm{font-size:.86em;color:var(--muted);padding-left:12px;background:var(--panel)}
.ln.fm .pk{color:var(--accent)}
.ln.hr{position:relative;color:transparent}
.ln.hr::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.ln.raw.hr{color:inherit}.ln.raw.hr::after{display:none}
.ln img,.md img{max-width:100%;max-height:360px;border-radius:6px;display:block;margin:4px 0}
.ln.tb{font-family:var(--f-mono);font-size:.86em;white-space:pre;overflow-x:auto}
.cm{color:var(--muted);opacity:.6}
.wl,.md a.wl{color:var(--accent);border-bottom:1px dashed var(--accent);cursor:pointer;text-decoration:none}
.wl.missing{opacity:.6}
.att{color:var(--accent);cursor:pointer;background:var(--accent-soft);border-radius:4px;padding:0 5px;text-decoration:none}
.lk{color:var(--accent);cursor:pointer;text-decoration:underline}
.tg{color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:10px;font-size:.88em;text-decoration:none}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
code.ic{font-family:var(--f-mono);font-size:.88em;background:var(--panel);padding:1px 4px;border-radius:4px}
.miss{color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 6px;font-size:.9em}
/* reading */
.md{font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh);word-break:keep-all;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-family:var(--f-title);line-height:1.35;margin:1.1em 0 .4em;text-wrap:balance}
.md h1{font-size:1.55em;margin-top:0}.md h2{font-size:1.32em}.md h3{font-size:1.15em}
.md h4,.md h5{font-size:1em;margin:1em 0 .3em}
.md p{margin:.45em 0}
.md a{color:var(--accent)}
.md a.tag{background:var(--accent-soft);text-decoration:none;padding:0 6px;border-radius:10px;font-size:.88em}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--panel);padding:1px 4px;border-radius:4px}
.md pre{background:var(--panel);padding:12px;border-radius:6px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md details.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;padding:6px 14px;margin:.8em 0}
.md details.callout summary{font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
.md details.callout summary::before{content:"▾ ";font-size:.8em}
.md details.callout:not([open]) summary::before{content:"▸ "}
.md details.callout summary::-webkit-details-marker{display:none}
.md details.blk{border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin:.6em 0;font-size:.9em}
.md details.blk summary{color:var(--muted);cursor:pointer}
.md ul,.md ol{padding-left:2.1em;margin:.4em 0}
.md li>ul,.md li>ol{padding-left:2.1em}
.miss[data-miss]{cursor:pointer}
.md li.task{list-style:none;margin-left:-1.6em}
.md li.task input{margin-right:8px;transform:translateY(2px)}
.md li.task.done>span{color:var(--muted);text-decoration:line-through}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 10px}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.props{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:6px}
.props dt{color:var(--muted)}.props dd{margin:0;min-width:0;overflow-wrap:anywhere}
.backlinks{margin-top:40px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.backlinks button{color:var(--accent);padding:2px 0;display:block}
/* menus & modals */
.menu{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:4px;min-width:190px;max-width:290px;max-height:70vh;overflow-y:auto}
.menu button{display:flex;width:100%;text-align:left;padding:8px 10px;font-size:14px;gap:8px;align-items:center}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .mh{font-size:11px;color:var(--muted);padding:6px 10px 2px;letter-spacing:.05em}
.menu .mi{font-size:12px;color:var(--muted);padding:6px 10px;line-height:1.5}
.veil{position:fixed;inset:0;background:rgba(10,14,12,.38);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:10px;width:min(600px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px}
.modal header,.modal .tabs,.modal footer{flex-shrink:0}

const WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{y,w}}
function fmt(d,f){d=new Date(d);const iw=isoWeek(d);
  return f.replace(/\[([^\]]*)\]|GGGG|YYYY|YY|WW|W|MM|M|DD|D|HH|H|mm|ss|dddd|ddd/g,(t,lit)=>lit!==undefined?lit:({GGGG:iw.y,YYYY:d.getFullYear(),YY:String(d.getFullYear()).slice(2),WW:pad(iw.w),W:iw.w,MM:pad(d.getMonth()+1),M:d.getMonth()+1,DD:pad(d.getDate()),D:d.getDate(),HH:pad(d.getHours()),H:d.getHours(),mm:pad(d.getMinutes()),ss:pad(d.getSeconds()),dddd:WD[d.getDay()]+'요일',ddd:WD[d.getDay()]})[t])}
function weekDay(off){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+off);return d}
function rel(t){const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return fmt(t,'HH:mm');const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return '어제';return d.getFullYear()===n.getFullYear()?fmt(t,'M.D (ddd)'):fmt(t,'YY.MM.DD')}
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
function applyTpl(text,title){const d=new Date();

   .replace(/\{\{weekday\}\}/g,fmt(d,'dddd')).replace(/\{\{title\}\}/g,title||'')

/* ---------- parsing ---------- */
function splitFM(body){const m=/^---\n([\s\S]*?)\n---(\n|$)/.exec(body||'');if(!m)return{fm:null,rest:body||''};
  const fm={};m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)fm[l.slice(0,i).trim()]=l.slice(i+1).trim()});return{fm,rest:body.slice(m[0].length)}}
const stripCode=b=>b.replace(/```[\s\S]*?(```|$)/g,'').replace(/`[^`\n]*`/g,'');
function contentLines(body){return stripCode(splitFM(body).rest).split('\n').map(l=>l.trim()).filter(Boolean)}
const noHtml=s=>s.replace(/<\/?(mark|u|span|b|i|s|br|sup|sub|font)\b[^>\n]*>/gi,'');
function titleOf(body){for(const l of contentLines(body)){const t=noHtml(l).replace(/^#{1,6}\s+/,'').replace(/^[-*+]\s+(\[.\]\s+)?/,'').replace(/^>\s?(\[![^\]]*\][+-]?)?\s*/,'').replace(/[*=~`]|\[\[|\]\]/g,'').trim();if(t)return t.slice(0,120)}return '제목 없음'}
function snippetOf(n){const ls=contentLines(n.body).map(noHtml);return (n.name?ls:ls.slice(1)).join(' ').replace(/[#*=>`~\[\]]|%%/g,'').replace(/!\S+/g,'').slice(0,160)}
const TAG_RE=/(^|[\s(])#([\p{L}\p{N}_\/-]*[\p{L}_\/-][\p{L}\p{N}_\/-]*)/gu;
function tagsOf(body){const {fm,rest}=splitFM(body);const out=new Set();
  if(fm&&fm.tags){fm.tags.replace(/[\[\]"']/g,'').split(/[,\s]+/).map(t=>t.replace(/^#/,'')).filter(Boolean).forEach(t=>out.add(t))}
  let m;const s=stripCode(rest).replace(/\[\[[^\]]*\]\]/g,'').replace(/<[a-zA-Z\/][^>\n]*>/g,' ');const re=new RegExp(TAG_RE.source,'gu');while((m=re.exec(s)))out.add(m[2]);return [...out]}
function todoOf(body){const open=(body.match(/^\s*[-*+]\s\[ \]/gm)||[]).length,done=(body.match(/^\s*[-*+]\s\[[xX]\]/gm)||[]).length;return{open,done}}
const IMG_EXT=/\.(png|jpe?g|gif|webp|bmp|svg|avif|heic)$/i;
const PH='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7#pn-';
const fileUrl=f=>PH+f.id;
function hydrateBlobs(){document.querySelectorAll('img[src*="#pn-"],[data-url*="#pn-"],a[href*="#pn-"]').forEach(el=>{const at=el.tagName==='IMG'?'src':el.tagName==='A'?'href':'data-url';const v=el.getAttribute(at)||'';const id=v.split('#pn-')[1];if(!id)return;
  const u=PN.cachedUrl(id);if(u){el.setAttribute(at,u);return}PN.blobUrl(id).then(url=>{if(url&&el.getAttribute(at)===v)el.setAttribute(at,url)}).catch(()=>{})})}
let hyQ=false;new MutationObserver(()=>{if(hyQ)return;hyQ=true;queueMicrotask(()=>{hyQ=false;hydrateBlobs()})}).observe(document.body,{childList:true,subtree:true});
function imagesOf(body){const out=[];let m;const s=stripCode(body);
  const r1=/!\[\[([^\]|#]+)(?:\|[^\]]*)?\]\]/g;while((m=r1.exec(s))){const f=S.files[m[1].trim()];if(f&&/^image\//.test(f.type||''))out.push(fileUrl(f))}
  const r2=/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g;while((m=r2.exec(s)))out.push(m[1]);return out}
function derive(n){n.title=(n.name&&n.name.trim())||titleOf(n.body);n.tags=tagsOf(n.body);const t=todoOf(n.body);n.open=t.open;n.done=t.done;n.hasImg=/!\[/.test(n.body);n.hasLink=/\[\[|\]\(http/.test(n.body);return n}

const F=()=>S.meta.folders||[];
const folder=id=>F().find(f=>f.id===id);
const kids=id=>F().filter(f=>(f.parent||'')===(id||'')).sort((a,b)=>((a.order??1e9)-(b.order??1e9))||a.name.localeCompare(b.name,'ko'));
function descendants(id){const out=[id];kids(id).forEach(k=>out.push(...descendants(k.id)));return out}
function folderPath(id){const p=[];let f=folder(id);let g=0;while(f&&g++<30){p.unshift(f.name);f=folder(f.parent)}return p.join('/')}
function folderLabel(id){return id===TPL?'템플릿':id?folderPath(id):'미분류'}

/* search language (search box) + filter rules */
function parseQ(q){const toks=(q.match(/-?\w+:"[^"]*"|-?\w+:\S+|"[^"]*"|\S+/g)||[]);
  return toks.map(t=>{let neg=false;if(t[0]==='-'&&t.includes(':')){neg=true;t=t.slice(1)}
    const m=/^(\w+):(.*)$/.exec(t);if(m)return{k:m[1].toLowerCase(),v:m[2].replace(/"/g,'').toLowerCase(),neg};return{k:'text',v:t.replace(/"/g,'').toLowerCase(),neg:false}})}
function matchQ(n,terms){for(const t of terms){let ok;
  switch(t.k){case'tag':ok=n.tags.some(x=>x.toLowerCase()===t.v||x.toLowerCase().startsWith(t.v+'/'));break;
   case'folder':{const ids=F().filter(f=>f.name.toLowerCase()===t.v).flatMap(f=>descendants(f.id));ok=ids.includes(n.folder)||(t.v==='미분류'&&!n.folder);break}
   case'is':ok=t.v==='fav'?!!n.fav:t.v==='todo'?n.open>0:t.v==='today'?isToday(n.updated):false;break;
   case'has':ok=t.v==='todo'?(n.open+n.done)>0:t.v==='link'?n.hasLink:t.v==='image'?n.hasImg:false;break;
   case'days':ok=now()-n.updated<= +t.v*864e5;break;
   case'in':ok=t.v==='untagged'?n.tags.length===0:t.v==='unfiled'?!n.folder:false;break;
   default:ok=(n.body+'\n'+(n.name||'')).toLowerCase().includes(t.v);}
  if(t.neg?ok:!ok)return false}return true}

function evalRule(n,r){let ok;switch(r.k){
  case'folder':ok=!!r.v&&descendants(r.v).includes(n.folder);break;case'tag':ok=!!r.v&&n.tags.some(x=>x===r.v||x.startsWith(r.v+'/'));break;

function bulk(kind){const L=selNotes();if(!L.length){toast('먼저 노트를 고르세요');return}const k=L.length;

function vaultPath(fid){const st=SET();if(fid===TPL)return st.vault.tpl||'Templates';if(!fid)return st.vault.map.__unfiled||'';
  const chain=[];let f=folder(fid);let g=0;while(f&&g++<30){chain.unshift(f);f=folder(f.parent)}if(!chain.length)return '';
  const top=chain[0];const base=(st.vault.map[top.id]||safeName(top.name));return [base,...chain.slice(1).map(x=>safeName(x.name))].join('/')}
function vaultBody(n){const b=n.body;if(!SET().vault.fill)return b;const m=/^---\n([\s\S]*?)\n---/.exec(b);if(!m)return b;

async function exportZip(list,withAtt,withTpl){if(typeof JSZip==='undefined'){toast('압축 도구를 불러오지 못했습니다');return}
  list=list.filter(n=>withTpl||n.folder!==TPL);if(!list.length){toast('내보낼 노트가 없습니다');return}toast('zip 만드는 중…');
  const z=new JSZip();const used={};const atts=new Set();
  list.forEach(n=>{const dir=vaultPath(n.folder);let base=(dir?dir+'/':'')+safeName(n.title);let p=base,i=2;while(used[p])p=base+' '+i++;used[p]=1;z.file(p+'.md',vaultBody(n),{date:new Date(n.updated)});
    if(withAtt){const re=/!?\[\[([^\]|#]+)/g;let m;while((m=re.exec(n.body)))if(S.files[m[1].trim()])atts.add(m[1].trim())}});
  let miss=0;for(const a of atts){try{const b=await PN.getBlob(S.files[a].id);if(!b)throw 0;z.file((SET().vault.att||'Attachments')+'/'+a,b)}catch(e){miss++}}
  const blob=await z.generateAsync({type:'blob'});const ok=await downloadFile(`포켓노트-${fmt(now(),'YYYYMMDD-HHmm')}.zip`,blob);
  if(ok){S.meta.lastExport=now();saveMeta();toast(`${list.length}개 노트를 내보냈습니다${miss?` · 첨부 ${miss}개는 빠짐`:''}`)}}

  else if(t.id==='q'){S.q=t.value;renderList();renderSide()}
  else if(t.id==='ttl'){const n=curNote();if(!n)return;n.name=t.value;n.updated=now();derive(n);pendingId=n.id;S.dirty.add(n.id);clearTimeout(editT);editT=setTimeout(flushEdit,600)}});
document.addEventListener('change',e=>{if(e.target.id==='fsel'){const n=curNote();n.folder=e.target.value;persist(n);renderSide();renderList()}});
document.addEventListener('focusin',e=>{if(e.target.id==='ed'||e.target.id==='ttl')setTyping(true)});
document.addEventListener('focusout',e=>{if(e.target.id==='ed'||e.target.id==='ttl')setTimeout(()=>{const a=document.activeElement;if(!a||!(a.id==='ed'||a.id==='live'||a.id==='ttl'))setTyping(false)},150)});
document.addEventListener('keydown',e=>{const t=e.target;
  if(S.selMode&&!t.closest('input,textarea,#live,.veil')){if(e.key==='Escape'){exitSel();return}if(e.key==='Delete'&&S.sel.size){e.preventDefault();if(S.view.k==='trash')bulk('purge');else bulk('trash');return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();listCache.forEach(x=>S.sel.add(x.id));renderList();return}}
  if(t.id==='ed'){if(sugEl&&e.key==='Escape'){closeSug();return}
    if(e.key==='Tab'){e.preventDefault();runTool(e.shiftKey?'outdent':'indent');return}
    if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&!e.shiftKey){const st=ED.get();const r=opEnter(st);if(r.text!==st.text.slice(0,st.s)+'\n'+st.text.slice(st.e)){e.preventDefault();ED.set(r.text,r.s,r.e)}return}}
  if(t.id==='ttl'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();if(S.mode==='live'&&LV.root)lvBuild(curNote().body,0,0,true);else $('#ed')?.focus();return}
  const mod=e.ctrlKey||e.metaKey;
  if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}
  else if(e.altKey&&!mod&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&(t.id==='ed'||t.id==='live')){e.preventDefault();runTool(e.key==='ArrowUp'?'up':'down')}
  else if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();newNote()}
  else if(mod&&e.key.toLowerCase()==='e'){e.preventDefault();flushEdit();S.mode=S.mode==='live'?'read':S.mode==='read'?'source':'live';savePrefs();renderNote()}
  else if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('#app').dataset.pane='list';$('#q')?.focus()}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dailyNote()}
  else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();flushEdit()}
  else if(mod&&(t.id==='ed'||t.id==='live')&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&(t.id==='ed'||t.id==='live')&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(mod&&(t.id==='ed'||t.id==='live')&&e.key.toLowerCase()==='b'){e.preventDefault();runTool('bold')}});
document.addEventListener('selectionchange',()=>{const a=document.activeElement;if(a&&a.id==='live'){lvSel();if(sugEl)checkSug()}else if(a&&a.id==='ed'&&sugEl)checkSug()});
window.addEventListener('beforeunload',flushEdit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushEdit()});
$('#note').addEventListener('paste',e=>{if(e.target.id!=='ed'||!e.clipboardData)return;const c=readClip(e.clipboardData);
  if(c.files.length){e.preventDefault();uploadFiles(c.files);return}const html=e.clipboardData.getData('text/html')||'';const st=ED.get();if(!st||!c.text)return;
  const r=pasteOp(st,c.text);const plain=st.text.slice(0,st.s)+c.text+st.text.slice(st.e);if(r.text!==plain||c.text!==(e.clipboardData.getData('text/plain')||'').replace(/\r\n?/g,'\n')){e.preventDefault();ED.set(r.text,r.s)}});

/* right-click & long-press menus */
let touchAt=0,lp=null;
document.addEventListener('touchstart',e=>{touchAt=now();const it=e.target.closest('.item[data-open]');clearTimeout(lp&&lp.t);lp=null;
  if(!it||e.touches.length!==1||e.target.closest('.grip'))return;const p=e.touches[0];
  lp={id:it.dataset.open,x:p.clientX,y:p.clientY,fired:false,t:setTimeout(()=>{if(!lp||now()-S.lpAt<900)return;lp.fired=true;S.lpAt=now();try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}itemMenu(lp.id,{x:lp.x,y:lp.y})},520)}},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{if(!lp)return;const p=e.touches[0];if(Math.hypot(p.clientX-lp.x,p.clientY-lp.y)>10){clearTimeout(lp.t);lp=null}},{passive:true,capture:true});
document.addEventListener('touchend',e=>{if(!lp)return;clearTimeout(lp.t);if(lp.fired&&e.cancelable)e.preventDefault();lp=null},{capture:true});
document.addEventListener('touchcancel',()=>{if(lp){clearTimeout(lp.t);lp=null}},{capture:true});
const fromTouch=()=>now()-touchAt<1200;
document.addEventListener('contextmenu',e=>{const t=e.target;if(t.closest('.veil,.menu,.gate'))return;
  const pt={x:e.clientX,y:e.clientY};
  const it=t.closest('.item[data-open]');if(it){e.preventDefault();if(fromTouch()&&now()-S.lpAt<900)return;S.lpAt=now();if(lp){clearTimeout(lp.t);lp.fired=true}itemMenu(it.dataset.open,pt);return}
  if(fromTouch()){if(t.closest('.side .nav,.note-bar'))e.preventDefault();return}  // phones: keep the normal long-press in text
  if(t.closest('input,textarea#q,select'))return;
  if(t.closest('#live,#ed,#md,.page')){if(e.shiftKey)return;e.preventDefault();editorMenu(pt);return}
  if(t.closest('.note-bar')){e.preventDefault();noteMenu(pt);return}
  const fn=t.closest('.nav[data-k="folder"]');if(fn&&fn.dataset.id&&fn.dataset.id!==TPL){e.preventDefault();folderMenu(pt,fn.dataset.id);return}
  const fl=t.closest('.nav[data-k="filter"]');if(fl){e.preventDefault();const f=S.meta.filters.find(x=>x.id===fl.dataset.id);if(f)menu(pt,[{label:'편집',fn:()=>filterEdit(f)},{label:'사이드바에서 숨기기',fn:()=>{f.hidden=true;saveMeta();renderSide()}},{label:'삭제',danger:true,fn:()=>{S.meta.filters=S.meta.filters.filter(x=>x!==f);if(S.view.id===f.id)S.view={k:'all'};saveMeta();renderAll()}}]);return}
  const tg=t.closest('.nav[data-k="tag"]');if(tg){e.preventDefault();const id=tg.dataset.id;menu(pt,[{label:`#${esc(id)} 노트 보기`,fn:()=>go({k:'tag',id})},{label:`#${esc(id)} 붙인 새 노트`,fn:()=>{S.view={k:'tag',id};newNote()}},{label:'이 태그로 스마트 필터 만들기',fn:()=>filterEdit(null,[{k:'tag',v:id}])}]);return}
  const fv=t.closest('.side [data-open]');if(fv){e.preventDefault();menu(pt,noteOpts(S.notes.get(fv.dataset.open),true));return}});
// a press on a note bar's empty part opens the note menu on phones too
(()=>{let h=null;$('#note').addEventListener('touchstart',e=>{const nb=e.target.closest('.note-bar');if(!nb||e.target.closest('button,select,.seg'))return;const p=e.touches[0];h=setTimeout(()=>{h=null;try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}noteMenu({x:p.clientX,y:p.clientY})},520)},{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(k=>$('#note').addEventListener(k,()=>{clearTimeout(h);h=null},{passive:true}))})();
/* links like …/#new and …/#daily, also when the app is already open */
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(!S.ready)return;if(h==='new'){clearHash();newNote()}else if(h==='daily'){clearHash();dailyNote()}});
/* swipe between notes */
let sw=null;
$('#note').addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('pre,table,.toolbar,.note-bar,input,.ln.tb,img'))return sw=null;const t=e.touches[0];sw={x:t.clientX,y:t.clientY,t:now()}},{passive:true});
$('#note').addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0];const dx=t.clientX-sw.x,dy=t.clientY-sw.y;if(Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx))sw=null;
  else if(Math.abs(dx)>14){const p=$('#page');if(p)p.style.transform=`translateX(${dx*.35}px)`}},{passive:true});
$('#note').addEventListener('touchend',e=>{const p=$('#page');if(p)p.style.transform='';if(!sw)return;const t=e.changedTouches[0];const dx=t.clientX-sw.x,dy=t.clientY-sw.y;const ok=Math.abs(dx)>70&&Math.abs(dy)<60&&now()-sw.t<700;sw=null;
  const s=getSelection();if(s&&!s.isCollapsed)return;const ed=$('#ed');if(ed&&ed.selectionStart!==ed.selectionEnd)return;if(ok)move(dx<0?1:-1)},{passive:true});

/* ---------- boot ---------- */
const cachedSet=store.get('mm-set',null);if(cachedSet)S.meta.settings=cachedSet;applyTheme();
const cached=store.get('mm-cache',null);
if(cached&&cached.notes){S.files=cached.files||{};cached.notes.forEach(n=>S.notes.set(n.id,derive({...n})));S.meta={folders:[],filters:[],favOrder:[],...(cached.meta||{}),settings:{...((cached.meta||{}).settings||{}),...(cachedSet||{})}};
  S.meta.filters=(S.meta.filters||[]).map(f=>f.rules||!f.q?f:{...f,rules:legacyRules(f.q)});S.ready=true;S.status='동기화 중'}
renderSide();renderList();
renderNote();

(async()=>{if(!window.claude||!claude.use){setStatus('이 화면에선 저장 안 됨');S.ready=true;renderList();return}
  const [db,user]=await Promise.all([cap('db'),cap('user')]);
  const id=user?await user.id():null;
  if(!db||!id){setStatus('로그인 필요 · 저장 안 됨');S.ready=true;renderList();return}
  S.uid=id;const NS=window.PN_BETA?'-beta':'';const root=db.doc(`data/users/${id}/vault${NS}`);notesCol=root.collection('notes');verCol=root.collection('versions');metaDoc=db.doc(`data/users/${id}/meta${NS}`);filesDoc=db.doc(`data/users/${id}/files${NS}`);
  let booted=false;const boot=()=>{if(booted)return;booted=true;const h=(location.hash||'').slice(1);if(h==='new'){clearHash();newNote()}else if(h==='daily'){clearHash();dailyNote()}};
  filesDoc.onSnapshot(s=>{const d=s.exists?s.data():{};const m={...(d.items||{})};(d.list||[]).forEach(x=>{if(x&&x.name)m[x.name]={id:x.id,type:x.type,size:x.size,t:x.t}});const before=Object.keys(S.files).length;S.files={...m,...S.files};cacheSoon();if(Object.keys(S.files).length>Object.keys(m).length&&before)saveFiles();
    const a=document.activeElement;const editing=a&&(a.id==='live'||a.id==='ed');const n=curNote();if(n&&!editing){if(S.mode==='live'&&LV.root)lvBuild(n.body,null,null,false);else if(S.mode==='read')renderNote()}if(S.view.k==='images')renderList()},()=>{});
  metaDoc.onSnapshot(s=>{const d=s.exists?s.data():{};
    S.meta={folders:[...(d.folders||[])].map(f=>({...f})),filters:[...(d.filters||[])].map(f=>{const x=JSON.parse(JSON.stringify(f));if(!x.rules&&x.q)x.rules=legacyRules(x.q);return x}),favOrder:[...(d.favOrder||[])],settings:d.settings?JSON.parse(JSON.stringify(d.settings)):(S.meta.settings||{}),lastExport:d.lastExport||0};
    store.set('mm-set',S.meta.settings);applyTheme();cacheSoon();renderSide();renderList();updateNoteBar()},()=>setStatus('연결 끊김'));
  notesCol.orderBy('updated','desc').limit(1000).onSnapshot(s=>{const next=new Map();
    s.docs.forEach(d=>{const local=S.notes.get(d.id);if(local&&(S.dirty.has(d.id)||pendingId===d.id)){next.set(d.id,local);return}next.set(d.id,derive({id:d.id,...d.data()}))});
    S.notes.forEach((n,k)=>{if(!next.has(k)&&S.dirty.has(k))next.set(k,n)});
    S.notes=next;S.ready=true;if(!S.dirty.size&&!pendingId)setStatus(s.metadata.fromCache?'동기화 중':'동기화됨');
    if(S.cur&&!S.notes.has(S.cur)){S.cur=null;renderAll();boot();return}
    cacheSoon();renderSide();renderList();
    const n=curNote();
    if(n&&!S.dirty.has(n.id)&&pendingId!==n.id){const a=document.activeElement;const editing=a&&(a.id==='live'||a.id==='ed'||a.id==='ttl');
      if(!editing){if(S.mode==='live'&&LV.root&&lvText()!==n.body)lvBuild(n.body,null,null,false);else if(S.mode==='source'&&$('#ed')&&$('#ed').value!==n.body){$('#ed').value=n.body;autosize($('#ed'))}else if(S.mode==='read'&&$('#md')&&S.shownBody!==n.body)renderNote()}}
    updateNoteBar();boot()
  },e=>{setStatus(e.code==='revoked'?'접근 권한 없음':'연결 끊김')});
})();
})();
</script>
